name: Bibliothek-Link auf allen Seiten

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  inject:
    runs-on: ubuntu-latest
    # Verhindert Endlosschleife: der eigene Commit löst den Workflow nicht erneut aus
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Bibliothek-Link automatisch')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sticky-Button in alle Seiten einsetzen
        run: |
          python3 << 'PYEOF'
          import os, re

          MARKER = '<!-- bibliothek-link -->'
          END    = '<!-- /bibliothek-link -->'

          BLOCK = MARKER + '''
          <style>
          .bib-sticky{position:fixed;right:18px;bottom:18px;z-index:9000;display:inline-flex;
            align-items:center;gap:9px;background:#5a7d95;color:#fff;text-decoration:none;
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;font-weight:700;font-size:.95rem;
            padding:13px 20px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25);
            transition:transform .15s ease,background .15s ease;}
          .bib-sticky:hover,.bib-sticky:focus{background:#4a6d85;transform:translateY(-2px);color:#fff;}
          .bib-sticky:focus-visible{outline:3px solid #fff;outline-offset:2px;}
          .bib-sticky .bib-ico{font-size:1.1rem;line-height:1;}
          @media (max-width:640px){
            .bib-sticky{right:12px;bottom:12px;padding:11px 16px;font-size:.88rem;}
          }
          @media print{.bib-sticky{display:none;}}
          @media (prefers-reduced-motion:reduce){.bib-sticky{transition:none;}}
          </style>
          <a class="bib-sticky" href="/bibliothek/" aria-label="Zur Lernolotl-Bibliothek">
            <span class="bib-ico" aria-hidden="true">&#128218;</span>
            <span>Zur Bibliothek</span>
          </a>
          <script>
          /* Haelt den Button frei von anderen fest positionierten Leisten
             (Bundle-Leiste, Cookie-Banner), damit nichts ueberlappt. */
          (function(){
            function hoehe(sel){
              var e=document.querySelector(sel);
              if(!e) return 0;
              var s=getComputedStyle(e);
              if(s.display==='none'||s.visibility==='hidden'||s.opacity==='0') return 0;
              var r=e.getBoundingClientRect();
              if(r.height===0) return 0;
              if(r.bottom < window.innerHeight - 4) return 0;
              return r.height;
            }
            function anpassen(){
              var b=document.querySelector('.bib-sticky');
              if(!b) return;
              var h=Math.max(hoehe('.sticky-bundle-bar'), hoehe('.cookie-banner.show'));
              if(h) b.style.bottom=(h+14)+'px';
              if(!h) b.style.removeProperty('bottom');
            }
            window.addEventListener('load',anpassen);
            window.addEventListener('resize',anpassen);
            window.addEventListener('scroll',anpassen,{passive:true});
            document.addEventListener('click',function(){ setTimeout(anpassen,80); });
            setTimeout(anpassen,1500);
          })();
          </script>
          ''' + END

          # Seiten, die den Button nicht bekommen sollen
          SKIP_NAMES = {'404.html'}
          SKIP_DIRS  = ('./.github', './node_modules', './bibliothek')

          def should_skip(path):
              if any(path.startswith(d) for d in SKIP_DIRS): return True
              if os.path.basename(path) in SKIP_NAMES: return True
              if 'google' in os.path.basename(path).lower(): return True
              return False

          geaendert = aktualisiert = uebersprungen = 0

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules', '.github')]
              for fn in files:
                  if not fn.endswith('.html'): continue
                  path = os.path.join(root, fn)
                  if should_skip(path):
                      uebersprungen += 1
                      continue
                  try:
                      html = open(path, encoding='utf-8').read()
                  except Exception:
                      continue
                  if '</body>' not in html:
                      uebersprungen += 1
                      continue

                  if MARKER in html:
                      # vorhandenen Block ersetzen, damit Änderungen überall ankommen
                      neu = re.sub(re.escape(MARKER) + r'.*?' + re.escape(END), BLOCK, html, flags=re.S)
                      if neu != html:
                          open(path, 'w', encoding='utf-8').write(neu)
                          aktualisiert += 1
                      continue

                  neu = html.replace('</body>', BLOCK + '\n</body>', 1)
                  open(path, 'w', encoding='utf-8').write(neu)
                  geaendert += 1
                  print('eingefügt:', path)

          print(f'\nNeu: {geaendert} | Aktualisiert: {aktualisiert} | Übersprungen: {uebersprungen}')
          PYEOF

      - name: Commit & Push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet && echo "Keine Änderungen." || (
            git commit -m "Bibliothek-Link automatisch auf allen Seiten gesetzt" &&
            git pull --rebase origin main &&
            git push
          )
