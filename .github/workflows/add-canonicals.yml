name: Add/Update Canonical Tags + OG/JSON-LD Sync
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  canonicals:
    runs-on: ubuntu-latest
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'canonical tags automatisch gesetzt')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix canonical + og:url + JSON-LD in all HTML files
        run: |
          BASE_URL="https://www.lernolotl.de"
          WRONG_BASE="https://lernolotl.de"

          find . -name "*.html" \
            ! -path "./.github/*" \
            ! -path "./node_modules/*" \
          | while IFS= read -r file; do
            RELATIVE="${file#./}"
            ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe='/:.-_~'))" "$RELATIVE")

            if [[ "$RELATIVE" == "index.html" ]]; then
              URL="${BASE_URL}/"
            elif [[ "$RELATIVE" == */index.html ]]; then
              DIR=$(dirname "$ENCODED")
              URL="${BASE_URL}/${DIR}/"
            else
              URL="${BASE_URL}/${ENCODED}"
            fi

            # 1) canonical Tag setzen/aktualisieren
            if grep -q 'rel="canonical"' "$file"; then
              sed -i "s|<link rel=\"canonical\"[^>]*>|<link rel=\"canonical\" href=\"${URL}\">|g" "$file"
            else
              sed -i "s|</head>|  <link rel=\"canonical\" href=\"${URL}\">\n</head>|g" "$file"
            fi

            # 2) og:url vereinheitlichen (non-www → www, falls vorhanden)
            sed -i "s|<meta property=\"og:url\" content=\"${WRONG_BASE}[^\"]*\"|<meta property=\"og:url\" content=\"${URL}\"|g" "$file"
            # og:url bereits auf www? Trotzdem auf die exakte Seiten-URL setzen
            sed -i "s|<meta property=\"og:url\" content=\"${BASE_URL}[^\"]*\"|<meta property=\"og:url\" content=\"${URL}\"|g" "$file"

            # 3) JSON-LD "url" vereinheitlichen (non-www → www)
            sed -i "s|\"url\": \"${WRONG_BASE}[^\"]*\"|\"url\": \"${URL}\"|g" "$file"
            sed -i "s|\"url\": \"${BASE_URL}[^\"]*\"|\"url\": \"${URL}\"|g" "$file"

            echo "✅ $RELATIVE → $URL"
          done

      - name: Commit & Push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          git diff --staged --quiet && echo "Keine Änderungen." || (
            git commit -m "SEO: canonical tags automatisch gesetzt" &&
            git pull --rebase origin main &&
            git push
          )
