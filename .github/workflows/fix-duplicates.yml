name: Duplikate bereinigen (Weiterleitung + Sitemap)

# Ersetzt doppelte Seiten durch eine Weiterleitung auf die aktuelle Version.
# Einstellungen: scripts/duplikate.json
#
# - Manuell über "Run workflow": zuerst dry_run = true (nur Bericht), dann false.
# - Läuft automatisch, wenn du eine der Doppelseiten oder die Einstellungen neu
#   hochlädst. Ist die hochgeladene Doppelseite NEUER als das Ziel, wird sie nicht
#   angefasst und im Bericht gemeldet – die aktuelle Fassung geht nie verloren.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (true = nur Bericht, false = wirklich schreiben)'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [main]
    paths:
      - 'lernolotl-steckbrief.html'
      - 'lernolotls-welt.html'
      - 'spiele/spiele/teich/index.html'
      - 'scripts/duplikate.json'
      - 'scripts/fix_duplicates.py'

permissions:
  contents: write

# Nicht gleichzeitig mit Sitemap/Aufräumen pushen
concurrency:
  group: lernolotl-site-writes
  cancel-in-progress: false

jobs:
  duplikate:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken (volle Historie für Änderungsdaten)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Duplikate prüfen und ersetzen
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 scripts/fix_duplicates.py --dry-run
          else
            python3 scripts/fix_duplicates.py
          fi

      # Pushes aus einer Action starten keine anderen Workflows –
      # deshalb die Sitemap hier direkt neu erzeugen.
      - name: Sitemap neu erzeugen
        if: github.event.inputs.dry_run != 'true'
        run: python3 scripts/generate_sitemap.py

      - name: Commit & Push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "SEO: Duplikate durch Weiterleitung ersetzt"
          git pull --rebase origin main
          git push origin main
