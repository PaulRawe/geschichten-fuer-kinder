name: Etsy-Abgleich (aufraeumen + Bilder)

# NEU: Zuerst wird abgeglichen, welche Etsy-Listings es nicht mehr gibt.
# Die fliegen aus Bibliothek, Geschichten, Ratgeber-Boxen und Bundle-Kaesten
# raus (scripts/etsy_aufraeumen.py). Danach wie bisher:
#
# Holt die Produktbilder aus dem Etsy-CSV-Export, verkleinert sie auf
# hoechstens 70 KB, legt sie unter bilder/produkte/ ab und setzt sie in die
# Bibliothek ein. Neue Etsy-Produkte werden dabei mit aufgenommen.
#
# Laeuft automatisch, sobald ein neuer CSV-Export hochgeladen wird,
# und laesst sich jederzeit von Hand starten (Reiter "Actions").

on:
  push:
    branches: [main]
    paths:
      - 'bibliothek/etsy-listings.csv'
      - 'scripts/etsy_bilder.py'
      - 'scripts/etsy_aufraeumen.py'
      - 'etsy-abgleich.json'
      - '.github/workflows/etsy-bilder.yml'
  workflow_dispatch:
    inputs:
      neu_laden:
        description: 'Alle Bilder noch einmal herunterladen (sonst nur die fehlenden)'
        type: boolean
        default: false
      nur_pruefen:
        description: 'Nur pruefen: zeigt, was entfernt wuerde, aendert nichts'
        type: boolean
        default: false
      erzwingen:
        description: 'Sicherheitsbremse aus (wenn wirklich mehr als 50 % geloescht wurden)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: lernolotl-site-writes
  cancel-in-progress: false

jobs:
  bilder:
    runs-on: ubuntu-latest
    # Verhindert eine Endlosschleife: der eigene Commit startet den Lauf nicht neu
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Etsy-Bilder automatisch')"

    steps:
      - uses: actions/checkout@v4
        with:
          # Vollstaendige Historie - ohne sie schlaegt "git pull --rebase" fehl,
          # sobald zwischendurch ein anderer Lauf gepusht hat.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Benoetigte Pakete
        run: pip install --quiet Pillow requests

      - name: Geloeschte Etsy-Listings von der Website entfernen
        run: |
          python3 scripts/etsy_aufraeumen.py \
            ${{ inputs.nur_pruefen && '--nur-pruefen' || '' }} \
            ${{ inputs.erzwingen && '--erzwingen' || '' }}
          if [ -f _werkstatt/etsy-abgleich-bericht.md ]; then
            cat _werkstatt/etsy-abgleich-bericht.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nur-Pruefen-Lauf hier beenden
        if: ${{ inputs.nur_pruefen }}
        run: echo "Nur geprueft - es wird nichts gespeichert." && exit 0

      - name: Bilder holen und einsetzen
        if: ${{ !inputs.nur_pruefen }}
        run: |
          python3 scripts/etsy_bilder.py ${{ inputs.neu_laden && '--neu-laden' || '' }}

      - name: Bibliothek-Themenseiten neu bauen
        if: ${{ !inputs.nur_pruefen }}
        # Ein Push dieses Laufs startet den Bibliothek-Workflow NICHT
        # (GitHub-Regel) - darum werden die Seiten hier gleich mitgebaut.
        run: python3 scripts/generate_bibliothek.py

      - name: Ergebnis zusammenfassen
        if: ${{ !inputs.nur_pruefen }}
        run: |
          {
            echo "### Bilder in der Bibliothek"
            echo ""
            anzahl=$(ls bilder/produkte/*.jpg 2>/dev/null | wc -l)
            echo "- Bilddateien gesamt: **${anzahl}**"
            if [ "$anzahl" -gt 0 ]; then
              groesse=$(du -sh bilder/produkte | cut -f1)
              groesstes=$(ls -S bilder/produkte/*.jpg | head -1 | xargs du -k | cut -f1)
              echo "- Speicherplatz: **${groesse}**"
              echo "- Groesstes Bild: **${groesstes} KB**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Aenderungen speichern
        if: ${{ !inputs.nur_pruefen }}
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add -A

          if git diff --staged --quiet; then
            echo "Keine Aenderungen - nichts zu speichern."
            exit 0
          fi

          git commit -m "Etsy-Bilder automatisch in die Bibliothek uebernommen (inkl. Abgleich geloeschter Listings)"

          # Bis zu fuenf Versuche. Hat in der Zwischenzeit ein anderer Lauf
          # gepusht, werden dessen Aenderungen davorgesetzt und erneut gepusht.
          for versuch in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Gespeichert (Versuch ${versuch})."
              exit 0
            fi
            echo "Push abgelehnt - hole die Zwischenstaende und versuche es erneut."
            git pull --rebase origin main || exit 1
            sleep 3
          done

          echo "Push nach fuenf Versuchen nicht moeglich."
          exit 1
