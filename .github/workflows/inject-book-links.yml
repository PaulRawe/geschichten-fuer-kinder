name: Lernolotl Buch-Links einfügen

# Läuft automatisch, wenn sich die Buch-Konfiguration ändert (z.B. neues Buch
# hinzugefügt), und kann jederzeit manuell über "Run workflow" gestartet werden.
on:
  push:
    paths:
      - "scripts/book-config.json"
      - "scripts/inject_book_links.py"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Buch-Links einfügen
        run: python3 scripts/inject_book_links.py

      - name: Änderungen committen
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Lernolotl Buch-Links aktualisiert"
          file_pattern: "lernolotl/*.html"
