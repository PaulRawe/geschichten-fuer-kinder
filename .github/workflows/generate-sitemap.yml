name: Generate Sitemap

# Ersetzt die alte Version. Neu: <lastmod> = Datum deiner letzten echten Änderung
# an der Seite (Bot-Commits zählen nicht), noindex-Seiten werden ausgelassen.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lernolotl-site-writes
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken (volle Historie für Git-Daten)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: sitemap.xml erzeugen
        run: python3 scripts/generate_sitemap.py

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "SEO: sitemap.xml automatisch generiert"
          git pull --rebase origin main
          git push origin main
